<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{{ title if title else "Alimenta+" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
  <header class="bg-green-600 text-white p-4 flex justify-between">
    <h1 class="font-bold text-xl">🍲 Alimenta+</h1>
    <nav>
      <a href="/" class="mr-4 hover:underline">Início</a>
      <a href="/add" class="hover:underline">Cadastrar alimento</a>
    </nav>
  </header>

  <main class="container mx-auto mt-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
