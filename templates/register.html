{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4">Registre-se</h2>
<form method="POST" action="{{ url_for('register') }}" class="bg-white p-6 shadow rounded w-full md:w-1/2">
  <div class="mb-3">
    <label class="block">Nome de usuario</label>
    <input type="username" name="username" required class="border rounded p-2 w-full">
  </div>
  <div class="mb-3">
    <label class="block">Senha</label>
    <input type="password" name="password" required class="border rounded p-2 w-full">
  </div>
  <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Registre-se</button>
</form>
<p class="mt-4"> Ja tem uma conta? <a href="{{ url_for('login') }}" class="text-blue-500 hover:underline">Login aqui</a></p>
{% endblock %}
