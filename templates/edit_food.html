{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4">Editar Alimento</h2>
<form method="POST" action="{{ url_for('edit_food', food_id=food.id) }}">
    <div class="mb-4">
        <label class="block text-gray-700">Nome do Alimento:</label>
        <input type="text" name="name" value="{{ food.name }}" class="w-full p-2 border rounded" required>
    </div>
    <div class="mb-4">
        <label class="block text-gray-700">Quantidade:</label>
        <input type="text" name="quantity" value="{{ food.quantity }}" class="w-full p-2 border rounded" required>
    </div>
    <div class="mb-4">
        <label class="block text-gray-700">Data de Validade:</label>
        <input type="date" name="expiration_date" value="{{ food.expiration_date }}" class="w-full p-2 border rounded" required>
    </div>
    <div class="mb-4">
        <label class="block text-gray-700">Localização:</label>
        <input type="text" name="location" value="{{ food.location }}" class="w-full p-2 border rounded" required>
    </div>
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Salvar Alterações</button>
</form>
{% endblock %}
